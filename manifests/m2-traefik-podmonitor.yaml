# 讓 rancher-monitoring 的 Prometheus 抓 RKE2 內附 Traefik 的指標（Traefik 預設已開 --metrics.prometheus，埠 9100/metrics）。
# 不動 Traefik 與叢集組態，只新增這個 PodMonitor。
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: rke2-traefik
  namespace: cattle-monitoring-system
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: rke2-traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
