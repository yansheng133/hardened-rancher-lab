# 事件驅動擴縮量測（KEDA 2.21.0 上游，metrics-api scaler 輪詢一個代表「佇列長度」的 HTTP 服務）
apiVersion: v1
kind: Namespace
metadata: {name: t-c2}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: queue, namespace: t-c2}
data:
  q.py: |
    import http.server, json, urllib.parse
    N = {"len": 0}
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path); q = urllib.parse.parse_qs(u.query)
            if u.path == "/set": N["len"] = int(q["n"][0])
            b = json.dumps(N).encode(); self.send_response(200); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def log_message(self, *a): pass
    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: queue, namespace: t-c2}
spec:
  replicas: 1
  selector: {matchLabels: {app: queue}}
  template:
    metadata: {labels: {app: queue}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: q
        image: registry.suse.com/bci/python:3.13
        command: ["python3", "/app/q.py"]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 32Mi}}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: queue}}]
---
apiVersion: v1
kind: Service
metadata: {name: queue, namespace: t-c2}
spec: {selector: {app: queue}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: t-c2}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: w
        image: registry.suse.com/bci/python:3.13
        command: ["python3", "-m", "http.server", "8080", "--directory", "/tmp"]
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 1, failureThreshold: 1}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 32Mi}}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: worker, namespace: t-c2}
spec:
  scaleTargetRef: {name: worker}
  pollingInterval: 1
  cooldownPeriod: 5
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 4, periodSeconds: 1}]}
        scaleDown: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 4, periodSeconds: 1}]}
  triggers:
  - type: metrics-api
    metricType: AverageValue
    metadata: {url: "http://queue.t-c2.svc/len", valueLocation: "len", targetValue: "1"}
